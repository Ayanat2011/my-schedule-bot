version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: schedule_bot_postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-schedule_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-schedule_password}
      POSTGRES_DB: ${DB_NAME:-schedule_bot_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-schedule_user} -d ${DB_NAME:-schedule_bot_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: schedule_bot_app
    restart: always
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${DB_USER:-schedule_user}:${DB_PASSWORD:-schedule_password}@db:5432/${DB_NAME:-schedule_bot_db}
    volumes:
      - ./:/app

volumes:
  postgres_data:
    driver: local
