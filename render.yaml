services:
  - type: worker
    name: kids-schedule-bot
    env: python
    region: frankfurt
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python -m bot.main
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: schedule-bot-db
          property: connectionString
      - key: DEFAULT_TIMEZONE
        value: Europe/Moscow
      - key: LOG_LEVEL
        value: INFO

databases:
  - name: schedule-bot-db
    databaseName: schedule_db
    user: schedule_user
    region: frankfurt
    plan: free
